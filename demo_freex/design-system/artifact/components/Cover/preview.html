<div style="position:relative;width:960px;height:288px;background:var(--ground);overflow:hidden">
<style>.blk{fill:var(--text)} .eye{fill:none;stroke:var(--ground);stroke-width:3} .on{fill:var(--ground)}</style>
<svg width="960" height="288" viewBox="0 0 960 288" style="position:absolute;left:0;top:0">
<!-- blocks: one slab in text (paper at night, ink on paper) x=520→960 bleeding off top and right; no other colour exists in the system
     arrangement: one tall slab bleeding off the top-right edge, name on the bare ground at left
     pattern: the status indicator — eleven eyelets, the third filled — because the brand marks every track as a position among eleven
     scales: eyelet pitch = 36px, radius 12px, stroke 3px; slab square-cornered (no radius tokens in the system) -->
<rect class="blk" x="520" y="0" width="440" height="288"/>
<g transform="translate(556,144)">
<circle class="eye" cx="0" cy="0" r="12"/><circle class="eye" cx="36" cy="0" r="12"/><circle class="eye on" cx="72" cy="0" r="12"/><circle class="eye" cx="108" cy="0" r="12"/><circle class="eye" cx="144" cy="0" r="12"/><circle class="eye" cx="180" cy="0" r="12"/><circle class="eye" cx="216" cy="0" r="12"/><circle class="eye" cx="252" cy="0" r="12"/><circle class="eye" cx="288" cy="0" r="12"/><circle class="eye" cx="324" cy="0" r="12"/><circle class="eye" cx="360" cy="0" r="12"/>
</g>
</svg>
<div style="position:absolute;left:40px;bottom:40px;max-width:440px;color:var(--text);font-family:var(--font-mono)">
<div style="font-size:68px;line-height:.95">DEMO_FREEX</div>
<div style="font-size:13.33px;margin-top:12px">Wear your free.quency</div>
</div>
</div>
